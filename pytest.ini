[pytest]
# `slow` marks long-running performance smoke tests (e.g. the ~1M-cell
# inspect). They are deselected from the default run so suite runtime is
# unchanged; run them explicitly with:  pytest -m slow
# `thingi10k_remote` downloads the Thingi10K tier-2 corpus on the fly
# (network + a few hundred MB into e2e/thingi10k/tier2); run explicitly
# with:  pytest -m thingi10k_remote
addopts = -m "not slow and not thingi10k_remote"
markers =
    slow: long-running performance smoke tests, deselected by default (run with -m slow)
    thingi10k_remote: downloads Thingi10K tier-2 meshes on the fly (run with -m thingi10k_remote; requires network)
