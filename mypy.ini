# Relaxed mypy configuration scoped to the adapters package (audit 2.5).
#
# Run from the repository root with the project venv:
#
#   python -m mypy mesh_issue_examiner/adapters
#
# Only the adapters tree is type-checked. Modules imported from the rest
# of the package (core, utils, ...) are analyzed but their errors are
# suppressed, so the check stays scoped. Mesh libraries without stubs
# (pymeshlab, meshio, vedo, ...) resolve to Any. No strictness flags are
# enabled; the test suite is not gated on this check.
[mypy]
mypy_path = .
files = mesh_issue_examiner/adapters
ignore_missing_imports = True
follow_imports = silent
